<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#09090a"><meta name="description" content="Escucha música urbana en UrbanaTV"><title>Música • UrbanaTV</title><style>
:root{color-scheme:dark;--bg:#09090a;--surface:#19191b;--line:#323235;--accent:#d5ff36}*{box-sizing:border-box}html{scrollbar-width:thin;scrollbar-color:#333 #09090a}body{background:var(--bg);color:#fafafa;font:14px system-ui,-apple-system,sans-serif;margin:0;padding-bottom:calc(110px + env(safe-area-inset-bottom))}button,a{touch-action:manipulation}a{color:inherit;text-decoration:none}.wrap{max-width:950px;margin:auto;padding:0 20px}.header{position:sticky;z-index:20;top:0;padding-top:env(safe-area-inset-top);background:#0b0b0bf0;backdrop-filter:blur(16px);border-bottom:1px solid var(--line)}.head{min-height:65px;display:flex;align-items:center;justify-content:space-between;gap:12px}.logo{font-weight:950;font-size:25px;letter-spacing:-1px}.logo span{color:var(--accent)}.back{border:1px solid var(--line);border-radius:9px;padding:10px 12px;font-size:12px}.intro{padding:35px 0 24px}.eyebrow{color:var(--accent);font-size:11px;font-weight:800;letter-spacing:2px}.intro h1{font-size:clamp(40px,9vw,74px);letter-spacing:-2px;line-height:1;margin:11px 0}.intro p{color:#aaa;line-height:1.6;max-width:540px}.search{width:100%;background:var(--surface);border:1px solid var(--line);color:white;border-radius:12px;padding:15px;font:inherit;margin:5px 0 23px}.songs{display:grid;gap:11px}.track{display:flex;align-items:center;gap:14px;background:#171719;border:1px solid var(--line);border-radius:12px;padding:12px;min-width:0}.cover{width:68px;height:68px;border-radius:9px;background:#28282b;object-fit:cover;flex-shrink:0}.placeholder{display:grid;place-items:center;color:var(--accent);font-size:29px}.details{min-width:0;flex:1}.details h2{margin:0 0 5px;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.details .artist{font-size:12px;color:#bcbcbc}.details p{color:#888;font-size:11px;margin:6px 0 0;line-height:1.4}.play{border:0;border-radius:50%;background:var(--accent);color:#090909;font-weight:800;font-size:16px;width:44px;height:44px;flex-shrink:0;cursor:pointer}.empty{border:1px dashed #444;border-radius:12px;padding:25px;color:#aaa;line-height:1.7}.player{position:fixed;z-index:30;left:0;right:0;bottom:0;background:#141415f7;backdrop-filter:blur(18px);border-top:1px solid #444;padding:12px 0 calc(10px + env(safe-area-inset-bottom))}.playerrow{display:flex;gap:12px;align-items:center}.now{flex:1;min-width:0}.now strong{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.now small{color:#aaa}.controls{display:flex;gap:9px;align-items:center}.controls button{border:1px solid #555;color:white;background:#252529;border-radius:100px;min-width:36px;height:36px;cursor:pointer}.controls .primary{background:var(--accent);color:#000;border:0}.progress{width:100%;accent-color:var(--accent);margin:9px 0 0}.timing{display:flex;justify-content:space-between;color:#999;font-size:10px}button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}@media(max-width:560px){.wrap{padding:0 16px}.intro{padding-top:25px}.track{gap:10px}.cover{width:55px;height:55px}.details h2{font-size:13px}.controls{gap:5px}.controls button{min-width:32px;height:32px}.playerrow{gap:7px}.now{font-size:12px}}</style></head><body><header class="header"><div class="wrap head"><a href="/" class="logo">URBANA<span>TV.</span></a><a href="/" class="back">← Volver a videos</a></div></header><main class="wrap"><section class="intro"><div class="eyebrow">♫ URBANA RADIO</div><h1>DALE PLAY<span style="color:var(--accent)">.</span></h1><p>Escucha las canciones de la comunidad. Cada MP3 tiene título, artista, descripción y portada opcional.</p></section><input id="search" class="search" type="search" placeholder="Buscar canciones o artistas…" aria-label="Buscar canciones"><div id="songs" class="songs" aria-live="polite"></div></main><footer class="player" aria-label="Reproductor de música"><div class="wrap"><div class="playerrow"><div class="now"><strong id="now">Selecciona una canción</strong><small id="artist">UrbanaTV Music</small></div><div class="controls"><button type="button" id="prev" aria-label="Anterior">⏮</button><button type="button" id="toggle" class="primary" aria-label="Reproducir o pausar">▶</button><button type="button" id="next" aria-label="Siguiente">⏭</button></div></div><input class="progress" id="seek" type="range" min="0" max="100" value="0" aria-label="Avanzar en canción"><div class="timing"><span id="elapsed">0:00</span><span id="duration">0:00</span></div></div><audio id="audio" preload="metadata"></audio></footer><script>
const el=id=>document.getElementById(id),audio=el('audio');let tracks=[],active=-1;const fmt=s=>Number.isFinite(s)?Math.floor(s/60)+':'+String(Math.floor(s%60)).padStart(2,'0'):'0:00';const safeFile=p=>typeof p==='string'&&/^\/mp3\/[A-Za-z0-9_./ -]+\.(mp3|MP3)$/.test(p)&&!p.includes('..');const safeCover=p=>typeof p==='string'&&(/^\/mp3\/[A-Za-z0-9_./ -]+\.(jpg|jpeg|png|webp)$/.test(p)||/^https:\/\//.test(p))&&!p.includes('..');
function render(){const q=el('search').value.toLowerCase().trim(),root=el('songs');root.replaceChildren();const rows=tracks.map((t,i)=>({...t,index:i})).filter(t=>(t.title+' '+t.artist+' '+t.description).toLowerCase().includes(q));if(!rows.length){const p=document.createElement('div');p.className='empty';p.textContent=tracks.length?'No hay resultados.':'Aún no hay canciones. Agrega archivos MP3 a la carpeta mp3/ y sus datos a mp3/catalog.json.';root.append(p);return}for(const t of rows){const card=document.createElement('article');card.className='track';let cover;if(t.cover&&safeCover(t.cover)){cover=document.createElement('img');cover.className='cover';cover.src=t.cover;cover.alt='Portada de '+t.title;cover.loading='lazy'}else{cover=document.createElement('div');cover.className='cover placeholder';cover.textContent='♫'}const info=document.createElement('div');info.className='details';const title=document.createElement('h2');title.textContent=t.title;const artist=document.createElement('div');artist.className='artist';artist.textContent=t.artist;const desc=document.createElement('p');desc.textContent=t.description||'';info.append(title,artist,desc);const btn=document.createElement('button');btn.className='play';btn.textContent=active===t.index&&!audio.paused?'Ⅱ':'▶';btn.setAttribute('aria-label','Reproducir '+t.title);btn.addEventListener('click',()=>{if(active===t.index){audio.paused?audio.play().catch(showError):audio.pause()}else select(t.index)});card.append(cover,info,btn);root.append(card)}}
function showError(){el('artist').textContent='No se pudo reproducir el archivo';el('toggle').textContent='▶'}
function select(i){if(i<0||i>=tracks.length)return;active=i;audio.src=tracks[i].file;el('now').textContent=tracks[i].title;el('artist').textContent=tracks[i].artist;audio.play().catch(showError);render()}
el('toggle').addEventListener('click',()=>{if(active<0){if(tracks.length)select(0);return}audio.paused?audio.play().catch(showError):audio.pause()});el('prev').addEventListener('click',()=>select(active>0?active-1:tracks.length-1));el('next').addEventListener('click',()=>select((active+1)%tracks.length));audio.addEventListener('ended',()=>select((active+1)%tracks.length));for(const event of ['pause','play'])audio.addEventListener(event,()=>{el('toggle').textContent=audio.paused?'▶':'Ⅱ';render()});audio.addEventListener('timeupdate',()=>{el('elapsed').textContent=fmt(audio.currentTime);if(audio.duration)el('seek').value=String(100*audio.currentTime/audio.duration)});audio.addEventListener('loadedmetadata',()=>el('duration').textContent=fmt(audio.duration));el('seek').addEventListener('input',()=>{if(Number.isFinite(audio.duration))audio.currentTime=audio.duration*(Number(el('seek').value)/100)});el('search').addEventListener('input',render);
fetch('/mp3/catalog.json',{cache:'no-store'}).then(r=>{if(!r.ok)throw Error('catálogo');return r.json()}).then(data=>{tracks=(Array.isArray(data)?data:[]).filter(t=>safeFile(t.file)&&typeof t.title==='string'&&typeof t.artist==='string').map(t=>({title:t.title,artist:t.artist,description:String(t.description||''),cover:t.cover||'',file:t.file}));render()}).catch(()=>{el('songs').textContent='No se pudo cargar el catálogo de música.'});
</script></body></html>
